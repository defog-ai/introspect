manifest:
  version: "0.1.2"
  schema: https://a2as.org/cert/schema
  subject:
    name: defog-ai/introspect
    source: https://github.com/defog-ai/introspect
    branch: main
    commit: "b77636c6"
    scope: [backend/query_data/analysis_prompts.py, backend/tools/analysis_agents.py, backend/tools/analysis_tools.py, backend/utils_chart.py,
      backend/utils_clarification.py, backend/utils_file_uploads/excel_utils.py, backend/utils_oracle.py, backend/utils_question_related.py,
      backend/utils_sql.py]
  issued:
    by: A2AS.org
    at: '2026-01-26T16:12:26Z'
  signatures:
    digest: sha256:eK-LxsVUtVKsJejH2GJHIbSMATRyuvu9xnyNgc_4QWU
    key: ed25519:VkQEIUajNa6dQaEQyPl69jmvqwLpwzSlzX7Ns0x7kTw
    sig: ed25519:9jpITaQQM_XM5ljca2Vxa2TbT6rebXkjCnL19AEzKGh0ZF0KrsAF5U2MIg7CI3bHrXvce9O7I2nYJAm-ouMHDQ

agents:
  analysis_agent:
    type: instance
    models: [gpt-4.1]
    params:
      name: data analyst
      instructions: [analyst_instructions]
  evaluator_agent:
    type: instance
    models: [gpt-4.1]
    params:
      name: evaluator
      output_type: EvaluatorAgentOutput
      instructions: [Your task is to evaluate all current analyses and their results and determine if the research is comprehensive
          enough or if more follow-up questions are needed. Always consider the user's question from multiple perspectives
          and assess if the current research addresses all important aspects of the original question., 'If you believe more
          research is needed:', '1. List 1-3 specific follow-up questions that would address important gaps in the current
          research but remain in context of the original question, database schema and provided PDFs. IMPORTANT: The questions
          MUST be phrased in a way that can be answered by the database, the internet, or provided PDFs.', 2. Briefly explain
          why the existing research is insufficient to answer the original question., 'If you believe the research is already
          comprehensive:', 1. State that no further research is needed, 2. Briefly explain why the existing research adequately
          answers the original question or why the original question is not answerable with the available tools.]
  report_agent:
    type: instance
    models: [gpt-4o]
    params:
      name: report generator
      instructions: [report_instructions]

models:
  gpt-4.1:
    type: default
    agents: [analysis_agent, evaluator_agent]
  gpt-4o:
    type: literal
    agents: [report_agent]

